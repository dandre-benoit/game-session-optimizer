; =============================================================================
;  config.exemple.ini — le modèle.
;
;  Copiez ce fichier sous le nom  config.ini  et modifiez celui-ci : c'est lui
;  que le programme lit. Si config.ini n'existe pas au lancement, il est créé
;  automatiquement à partir de ce modèle.
;
;  config.ini n'est jamais versionné : il vous appartient, et une mise à jour
;  de l'outil ne peut pas l'écraser.
;
;  Tout ce qui commence par ";" est un commentaire, ignoré par le programme.
;  Une application listée mais non installée est ignorée : rien à nettoyer.
;  Une entrée qui ne vous concerne pas peut être commentée ou effacée.
; =============================================================================


; -----------------------------------------------------------------------------
;  [Games] — un jeu par ligne :   NOM = chemin de l'exécutable
;
;  "auto" laisse le programme chercher le jeu tout seul (registre, bibliothèques
;  Steam, dossiers habituels des launchers). Le résultat est mémorisé, la
;  recherche n'a donc lieu qu'une fois.
;
;  S'il ne trouve pas, remplacez "auto" par le chemin complet, par exemple :
;      BF6 = C:\Program Files\EA Games\Battlefield 6\bf6.exe
;
;  Le NOM sert à nommer le raccourci du Bureau : "Lancer <NOM>".
; -----------------------------------------------------------------------------
[Games]
BF6 = auto
MW4 = auto




; -----------------------------------------------------------------------------
;  [CloseGracefully] — une application par ligne.
;
;  On leur demande poliment de se fermer (comme un clic sur la croix), ce qui
;  leur laisse le temps de sauvegarder. Elles ne sont forcées que si elles ne
;  répondent pas dans le délai imparti (option CloseTimeout, plus bas).
;
;  À réserver aux applications qui ont une vraie fenêtre et du travail en cours.
; -----------------------------------------------------------------------------
[CloseGracefully]
OUTLOOK.EXE
chrome.exe
msedge.exe
firefox.exe
Spotify.exe
;Code.exe
;phpstorm64.exe
;devenv.exe


; -----------------------------------------------------------------------------
;  [NoReopen] — ne pas relancer ce qui tournait en arrière-plan.
;
;  Ces applications ne sont pas relancées SI elles tournaient en arrière-plan,
;  c'est-à-dire sans aucune fenêtre. Si vous en aviez une d'ouverte, elle est
;  rouverte normalement.
;
;  Le cas type est Edge, que Windows précharge au démarrage sans que vous
;  l'ayez ouvert : le relancer après la partie ferait apparaître une fenêtre
;  qui n'existait pas avant. Mais si vous naviguiez vraiment dessus, vous
;  retrouvez vos onglets.
;
;  L'application doit aussi figurer dans une des listes de fermeture pour être
;  fermée — celle-ci ne fait que conditionner sa réouverture.
; -----------------------------------------------------------------------------
[NoReopen]
msedge.exe

; -----------------------------------------------------------------------------
;  [CloseForced] — une application par ligne.
;
;  Utilitaires sans fenêtre de premier niveau : leur demander de se fermer ne
;  servirait à rien (personne pour recevoir la demande) et ils n'ont rien à
;  sauvegarder. On les arrête donc directement.
; -----------------------------------------------------------------------------
[CloseForced]
Screenpresso.exe
wallpaper64.exe
PowerToys.exe
OneDrive.exe
wampmanager.exe
php-cgi.exe
mysqld.exe
httpd.exe


; -----------------------------------------------------------------------------
;  [Services] — services Windows à arrêter, un par ligne (nom court du service).
;
;  Ils demandent en général les droits administrateur : sans élévation, l'arrêt
;  échoue proprement et le lancement continue.
;  L'indexation Windows (WSearch) est gérée par l'option StopSearchIndexing.
;
;  Vide par défaut : les services à arrêter sont propres à chaque machine.
;  Exemple pour un serveur local WAMP — décommentez si cela vous concerne :
; -----------------------------------------------------------------------------
[Services]
;wampapache64
;wampmysqld64
;wampmariadb64


; -----------------------------------------------------------------------------
;  [Arguments] — arguments à réutiliser au redémarrage, par application.
;
;  Les chemins d'installation, eux, n'ont pas à être indiqués : ils sont relevés
;  automatiquement au moment de la fermeture, puis réutilisés par
;  le raccourci "Tout rouvrir". Rien à saisir ici dans le cas courant.
; -----------------------------------------------------------------------------
[Arguments]
OneDrive.exe = /background


; -----------------------------------------------------------------------------
;  [Options] — réglages généraux. true / false pour les interrupteurs.
; -----------------------------------------------------------------------------
[Options]

; Où placer les raccourcis créés par setup.bat.
; Vide ou absent : sur le Bureau.
; Les variables d'environnement sont acceptées, et un chemin relatif part du
; dossier de l'outil. Exemples :
;     ShortcutFolder = %USERPROFILE%\Desktop\Jeux
;     ShortcutFolder = shortcuts
ShortcutFolder =
; Créer aussi un raccourci "Tester le mode jeu", qui déroule le cycle complet
; avec un faux jeu : tout se ferme et se rouvre vraiment, mais aucune partie
; n'est lancée. Pratique pour vérifier sa configuration.
TestShortcut = false

; Secondes laissées à une application pour se fermer proprement avant de forcer.
CloseTimeout = 8

; Secondes d'attente pour voir le jeu apparaître avant de signaler un problème.
StartTimeout = 30

; Tout remettre en place automatiquement quand le jeu se ferme.
; La fenêtre noire reste ouverte pendant la partie et se réveille à la fin.
; La fermer n'annule rien : le raccourci "Tout rouvrir" fait de même.
AutoRestore = true

; Secondes d'observation après la disparition du jeu avant de conclure que la
; partie est finie. Un launcher relance parfois le processus (mise à jour,
; retour au menu) : ce délai évite de tout rouvrir en plein milieu.
AutoRestoreDelay = 3

; Garder la fenêtre noire ouverte à la fin, en attendant une touche.
; À passer à false si vous avez mis AutoRestore = false : le script se termine
; alors dès le jeu lancé, et il n'y a plus rien à lire.
; Une erreur fait toujours attendre, quelle que soit cette option.
KeepWindowOpen = true
; Arrêter l'indexation Windows (WSearch) : grosse consommatrice d'E/S disque,
; cause classique de micro-freezes en pleine partie.
StopSearchIndexing = true

; Arrêter la Xbox Game Bar, qui enregistre en continu pendant le jeu.
; Ces processus se relancent seuls à la demande : rien à restaurer.
StopXboxGameBar = true

; Vérifications appliquées par défaut, quand le jeu n'en déclare pas lui-même.
; Vide = aucune. Valeurs possibles :
;     TPM, SecureBoot, ResizableBAR, NvidiaDriver, DiskSpace
Checks = DiskSpace


; -----------------------------------------------------------------------------
;  [Launchers] — les plateformes de jeu, une par ligne.
;
;  Fermées avant la partie, à une exception près : celle dont le jeu que vous
;  lancez a besoin reste ouverte, sinon le jeu ne démarrerait pas. Elle se
;  déclare par  Launcher =  dans la section [Game.<NOM>], tout en bas.
;
;  Elles sont à part pour cette raison : ce sont les seules entrées de ce
;  fichier dont le sort dépend du jeu lancé.
; -----------------------------------------------------------------------------
[Launchers]
steam.exe
EpicGamesLauncher.exe
Battle.net.exe
EADesktop.exe
XboxPcApp.exe


; -----------------------------------------------------------------------------
;  [Game.<NOM>] — réglages propres à un jeu (facultatif).
;
;  Title        le nom complet du jeu, tel qu'il apparaîtra sur le raccourci du
;               Bureau et dans les messages. Sans lui, le NOM court est
;               utilisé tel quel.
;
;  Checks       les vérifications à faire pour ce jeu. Les anticheats au niveau
;               noyau exigent TPM 2.0 et Secure Boot, ce qui n'a aucun sens
;               pour un autre jeu.
;
;  Launcher     la plateforme dont CE jeu a besoin pour démarrer. Elle sera la
;               seule à ne pas être fermée. Sans cette ligne, le jeu risque de
;               ne pas se lancer si sa plateforme figure dans les listes
;               ci-dessus. Un même jeu acheté ailleurs change de launcher :
;               c'est pour ça que la valeur se déclare par jeu.
; -----------------------------------------------------------------------------
[Game.BF6]
Title = Battlefield 6
Checks = TPM, SecureBoot, ResizableBAR, NvidiaDriver, DiskSpace
Launcher = EADesktop.exe

[Game.MW4]
Title = Call of Duty 4 - Modern Warfare
Checks = TPM, SecureBoot, ResizableBAR, NvidiaDriver, DiskSpace
Launcher = XboxPcApp.exe
