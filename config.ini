; =============================================================================
;  config.ini — configuration de base.
;
;  Tout ce qui commence par ";" est un commentaire, ignoré par le programme.
;  Une application listée mais non installée est ignorée : rien à nettoyer.
;
;  Ceci est la base commune. Plutôt que de la modifier, préférez y ajouter vos
;  différences dans un fichier  config.local.ini  à côté : il n'est jamais
;  versionné, donc une mise à jour ne peut pas l'écraser. Copiez
;  config.local.exemple.ini pour démarrer.
; =============================================================================


; -----------------------------------------------------------------------------
;  [Games] — un jeu par ligne :   NOM = chemin de l'exécutable
;
;  "auto" laisse le programme chercher le jeu tout seul (registre, bibliothèques
;  Steam, dossiers habituels des launchers). Le résultat est mémorisé, la
;  recherche n'a donc lieu qu'une fois.
;
;  S'il ne trouve pas, remplacez "auto" par le chemin complet, par exemple :
;      BF6 = C:\Program Files\EA Games\Battlefield 6\bf6.exe
;
;  Le NOM est celui passé par le raccourci "play-<NOM>.bat".
; -----------------------------------------------------------------------------
[Games]
BF6 = auto
MW4 = auto


; -----------------------------------------------------------------------------
;  [CloseGracefully] — une application par ligne.
;
;  On leur demande poliment de se fermer (comme un clic sur la croix), ce qui
;  leur laisse le temps de sauvegarder. Elles ne sont forcées que si elles ne
;  répondent pas dans le délai imparti (option CloseTimeout, plus bas).
;
;  À réserver aux applications qui ont une vraie fenêtre et du travail en cours.
; -----------------------------------------------------------------------------
[CloseGracefully]
OUTLOOK.EXE
chrome.exe
msedge.exe
firefox.exe
Discord.exe
Spotify.exe
Code.exe
phpstorm64.exe
devenv.exe
EpicGamesLauncher.exe
Battle.net.exe


; -----------------------------------------------------------------------------
;  [CloseForced] — une application par ligne.
;
;  Utilitaires sans fenêtre de premier niveau : leur demander de se fermer ne
;  servirait à rien (personne pour recevoir la demande) et ils n'ont rien à
;  sauvegarder. On les arrête donc directement.
; -----------------------------------------------------------------------------
[CloseForced]
Screenpresso.exe
wallpaper64.exe
PowerToys.exe
OneDrive.exe
wampmanager.exe
php-cgi.exe
mysqld.exe
httpd.exe


; -----------------------------------------------------------------------------
;  [Services] — services Windows à arrêter, un par ligne (nom court du service).
;
;  Ils demandent en général les droits administrateur : sans élévation, l'arrêt
;  échoue proprement et le lancement continue.
;  L'indexation Windows (WSearch) est gérée par l'option StopSearchIndexing.
;
;  Vide par défaut : les services à arrêter sont propres à chaque machine
;  (un serveur local WAMP, par exemple). Déclarez-les dans config.local.ini.
; -----------------------------------------------------------------------------
[Services]


; -----------------------------------------------------------------------------
;  [Arguments] — arguments à réutiliser au redémarrage, par application.
;
;  Les chemins d'installation, eux, n'ont pas à être indiqués : ils sont relevés
;  automatiquement au moment de la fermeture, puis réutilisés par
;  "restore-all.bat". Il n'y a donc rien à saisir ici dans le cas courant.
; -----------------------------------------------------------------------------
[Arguments]
OneDrive.exe = /background


; -----------------------------------------------------------------------------
;  [Options] — réglages généraux. true / false pour les interrupteurs.
; -----------------------------------------------------------------------------
[Options]

; Secondes laissées à une application pour se fermer proprement avant de forcer.
CloseTimeout = 8

; Secondes d'attente pour voir le jeu apparaître avant de signaler un problème.
StartTimeout = 30

; Tout remettre en place automatiquement quand le jeu se ferme.
; La fenêtre noire reste ouverte pendant la partie et se réveille à la fin.
; La fermer n'annule rien : restore-all.bat fait la même chose à la demande.
AutoRestore = true

; Secondes d'observation après la disparition du jeu avant de conclure que la
; partie est finie. Un launcher relance parfois le processus (mise à jour,
; retour au menu) : ce délai évite de tout rouvrir en plein milieu.
AutoRestoreDelay = 30

; Arrêter l'indexation Windows (WSearch) : grosse consommatrice d'E/S disque,
; cause classique de micro-freezes en pleine partie.
StopSearchIndexing = true

; Arrêter la Xbox Game Bar, qui enregistre en continu pendant le jeu.
; Ces processus se relancent seuls à la demande : rien à restaurer.
StopXboxGameBar = true

; Fermer Steam avant de lancer le jeu (via son arrêt officiel -shutdown).
; À passer à false si le jeu lancé est lui-même un jeu Steam.
StopSteam = true

; Vérifications appliquées par défaut, quand le jeu n'en déclare pas lui-même.
; Vide = aucune. Valeurs possibles :
;     TPM, SecureBoot, ResizableBAR, NvidiaDriver, DiskSpace
Checks = DiskSpace


; -----------------------------------------------------------------------------
;  [Game.<NOM>] — réglages propres à un jeu (facultatif).
;
;  Utile surtout pour les vérifications : les anticheats au niveau noyau
;  exigent TPM 2.0 et Secure Boot, ce qui n'a aucun sens pour un autre jeu.
; -----------------------------------------------------------------------------
[Game.BF6]
Checks = TPM, SecureBoot, ResizableBAR, NvidiaDriver, DiskSpace

[Game.MW4]
Checks = SecureBoot, ResizableBAR, NvidiaDriver, DiskSpace
