; =============================================================================
;  config.local.exemple.ini — modèle de personnalisation
;
;  Pour l'utiliser : copiez ce fichier sous le nom  config.local.ini
;  (à côté de config.ini) et ne gardez que les lignes qui vous concernent.
;
;  config.local.ini n'est jamais versionné : c'est votre fichier, une mise à
;  jour du dépôt ne peut pas l'écraser. config.ini, lui, reste la base commune
;  et n'a pas besoin d'être modifié.
;
;  Comment les deux se combinent, section par section :
;
;      CloseTimeout = 12        un réglage déjà présent est REMPLACÉ
;      Discord.exe              une entrée absente est AJOUTÉE
;      -Spotify.exe             le "-" RETIRE une entrée de la base
;
;  Autrement dit, il n'y a jamais besoin de recopier une section entière :
;  seules les différences se déclarent ici.
; =============================================================================


; -----------------------------------------------------------------------------
;  Le jeu n'est pas trouvé automatiquement, ou il est installé ailleurs
; -----------------------------------------------------------------------------
; [Games]
; BF6 = D:\Jeux\Battlefield 6\bf6.exe


; -----------------------------------------------------------------------------
;  Applications propres à votre PC
; -----------------------------------------------------------------------------
; [CloseGracefully]
; Teams.exe
; -Spotify.exe          ; celle-là, vous préférez la garder ouverte

; [CloseForced]
; MonUtilitaire.exe


; -----------------------------------------------------------------------------
;  Services Windows à arrêter (nom court du service).
;  Exemple type : un serveur local WAMP.
; -----------------------------------------------------------------------------
; [Services]
; wampapache64
; wampmysqld64
; wampmariadb64


; -----------------------------------------------------------------------------
;  Réglages
; -----------------------------------------------------------------------------
; [Options]
; StartTimeout = 60         ; connexion lente, le launcher met du temps
; StopSteam = false         ; le jeu lancé est lui-même un jeu Steam
